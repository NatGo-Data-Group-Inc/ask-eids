<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIDS Product Knowledge Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RESET & VARIABLES
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --page-bg: #edf1f7;
  --card-bg: #ffffff;
  --card-border: #d0d7e2;
  --card-shadow: 0 1px 3px rgba(10,25,60,.05), 0 4px 14px rgba(10,25,60,.04);
  --card-shadow-hover: 0 2px 8px rgba(10,25,60,.10), 0 10px 28px rgba(10,25,60,.06);

  --nav-bg: #0a1628;
  --nav-bg-end: #122244;
  --nav-accent: #7eb8e6;

  --text-900: #0f1a2e;
  --text-700: #2e3a50;
  --text-500: #5a6680;
  --text-300: #94a0b8;
  --text-100: #c8ceda;

  --green-700: #15803d;
  --green-600: #16a34a;
  --green-100: #dcfce7;
  --green-50: #f0fdf4;
  --amber-700: #a16207;
  --amber-600: #ca8a04;
  --amber-100: #fef3c7;
  --amber-50: #fffbeb;
  --red-700: #b91c1c;
  --red-600: #dc2626;
  --red-100: #fee2e2;
  --red-50: #fef2f2;
  --blue-700: #1a4b8c;
  --blue-600: #1e5fad;
  --blue-100: #d4e4f7;
  --blue-50: #eaf1fb;
  --purple-700: #5b3a9e;
  --purple-600: #6d4bb5;
  --purple-100: #e6dff5;
  --purple-50: #f3effb;
  --slate-600: #3e506a;
  --slate-100: #eceff4;
  --cyan-600: #0c7792;
  --cyan-100: #c8f0fa;

  --accent: #1a5ca0;
  --accent-hover: #13477d;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-sm: 6px;
}

html { font-size: 17px; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'Outfit', sans-serif;
  color: var(--text-900);
  background: var(--page-bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(26,92,160,.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(10,22,40,.04) 0%, transparent 60%);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

:focus-visible {
  outline: 3px solid var(--blue-600);
  outline-offset: 2px;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  box-shadow: 0 0 0 3px rgba(30, 95, 173, 0.22);
}

h1, h2, h3, h4 { font-family: 'Newsreader', serif; font-weight: 600; color: var(--text-900); }
h1 { font-size: 1.85rem; letter-spacing: -0.02em; }
h2 { font-size: 1.4rem; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; }

.label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-500); }

/* ================================================================
   TOP NAV
   ================================================================ */
.topnav {
  display: flex; align-items: center; justify-content: space-between;
  height: 62px; padding: 0 32px;
  background: linear-gradient(135deg, var(--nav-bg), var(--nav-bg-end));
  color: var(--nav-accent);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(22,27,46,.18);
}
.topnav-brand { display: flex; align-items: center; gap: 14px; }
.topnav-logo {
  font-family: 'Newsreader', serif; font-weight: 700; font-size: 1.15rem;
  color: #fff; letter-spacing: .06em;
  padding: 3px 10px; border: 1.5px solid var(--nav-accent); border-radius: 4px;
  background: linear-gradient(135deg, rgba(126,184,230,.12), rgba(126,184,230,.04));
}
.topnav-title { font-weight: 400; font-size: .92rem; color: #a8bdd6; letter-spacing: .01em; }
.topnav-search {
  flex: 0 1 420px;
}
.topnav-search input {
  width: 100%; padding: 8px 16px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07);
  color: #e0e2e8; font-size: .85rem; outline: none; transition: all .2s;
}
.topnav-search input::placeholder { color: #6a6f82; }
.topnav-search input:focus { background: rgba(255,255,255,.12); border-color: rgba(126,184,230,.5); }
.topnav-user { display: flex; align-items: center; gap: 10px; }
.topnav-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #2563eb, #1a5ca0);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 600; color: #fff; letter-spacing: .04em;
  border: 2px solid rgba(126,184,230,.3);
}
.topnav-username { font-size: .82rem; color: #a8bdd6; font-weight: 400; }

/* ================================================================
   LAYOUT
   ================================================================ */
.page { max-width: 100%; margin: 0 auto; padding: 32px 48px 60px; }
.page-header { margin-bottom: 24px; }
.page-header h1 { margin-bottom: 4px; }

/* ================================================================
   PORTFOLIO LANDING
   ================================================================ */
.pulse-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px;
  padding: 16px 24px; border-radius: var(--radius); margin-bottom: 12px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  font-size: .9rem; color: var(--text-500);
}
.pulse-stat { display: flex; align-items: center; gap: 6px; }
.pulse-stat strong { color: var(--text-900); font-weight: 600; }
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; display: inline-block;
}

.alerts-bar {
  display: flex; flex-wrap: wrap; gap: 10px 24px;
  padding: 14px 24px; border-radius: var(--radius); margin-bottom: 28px;
  background: #e8eef6; border: 1px solid #c8d4e4;
  font-size: .88rem; color: #1a4b8c;
}
.alerts-bar .alert-item::before { content: '\25CF'; margin-right: 6px; font-size: .55rem; vertical-align: middle; }

.section-label {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.section-label h2 { font-size: 1.25rem; }
.section-badge {
  font-size: .76rem; font-weight: 600; padding: 3px 12px; border-radius: 20px;
  font-family: 'Outfit', sans-serif;
}
.section-badge.warn { background: var(--red-100); color: var(--red-700); }
.section-badge.ok { background: var(--green-100); color: var(--green-700); }

.product-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 20px; margin-bottom: 36px;
}

/* Product Card */
.pcard {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); padding: 0;
  box-shadow: var(--card-shadow); transition: box-shadow .25s, transform .25s;
  cursor: pointer; overflow: hidden;
  animation: cardIn .5s ease both;
}
.pcard:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-3px); }
.pcard-top {
  height: 5px;
}
.pcard-top.risk { background: linear-gradient(90deg, var(--red-600), var(--red-700)); }
.pcard-top.caution { background: linear-gradient(90deg, var(--amber-600), var(--amber-700)); }
.pcard-top.healthy { background: linear-gradient(90deg, #1a5ca0, #13477d); }

.pcard-body { padding: 20px 24px 22px; }
.pcard-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.pcard-name { font-family: 'Newsreader', serif; font-weight: 600; font-size: 1.2rem; }
.pcard-status {
  font-size: .76rem; font-weight: 600; padding: 4px 12px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .06em;
}
.pcard-status.risk { background: var(--red-100); color: var(--red-700); }
.pcard-status.caution { background: var(--amber-100); color: var(--amber-700); }
.pcard-status.healthy { background: var(--green-100); color: var(--green-700); }

.pcard-middle { display: flex; align-items: center; gap: 22px; margin-bottom: 16px; }
.pcard-health-ring { flex-shrink: 0; }
.health-ring-track { fill: none; stroke: #d4dae6; stroke-width: 5; }
.health-ring-progress { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.health-ring-text { font-family: 'Newsreader', serif; font-weight: 700; font-size: 16px; fill: var(--text-900); }
.health-ring-label { font-family: 'Outfit', sans-serif; font-size: 7px; fill: var(--text-500); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }

.pcard-stats { font-size: .9rem; color: var(--text-500); line-height: 1.7; }
.pcard-stats strong { color: var(--text-700); font-weight: 600; }

.pcard-gaps { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.pcard-gap {
  font-size: .84rem; color: var(--amber-700); display: flex; align-items: center; gap: 7px;
  padding: 5px 10px; background: var(--amber-50); border-radius: var(--radius-sm);
}
.pcard-gap.ok { color: var(--green-700); background: var(--green-50); }

.pcard-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--card-border);
  font-size: .88rem;
}
.pcard-pm { color: var(--text-500); }
.pcard-pm strong { color: var(--text-700); }
.pcard-link {
  font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 4px;
  transition: gap .2s;
}
.pcard:hover .pcard-link { gap: 8px; }

/* Quick Views */
.quick-views {
  display: flex; flex-wrap: wrap; gap: 10px; padding-top: 8px;
  border-top: 1px solid var(--card-border);
}
.qv-btn {
  padding: 10px 20px; border-radius: 8px; font-size: .9rem; font-weight: 500;
  background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-700);
  transition: all .2s;
}
.qv-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ================================================================
   PRODUCT VIEW SHELL
   ================================================================ */
.product-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px; flex-wrap: wrap; gap: 8px;
}
.product-back {
  font-size: .82rem; color: var(--text-500); cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: color .2s;
}
.product-back:hover { color: var(--accent); text-decoration: none; }
.product-meta { display: flex; align-items: center; gap: 16px; font-size: .8rem; color: var(--text-500); }
.product-meta-item { display: flex; align-items: center; gap: 5px; }

.product-title-row {
  display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap;
}
.product-title-row h1 { font-size: 1.6rem; }
.product-status-badge {
  font-size: .72rem; font-weight: 600; padding: 4px 12px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .06em;
}

.product-tabs {
  display: flex; gap: 0; border-bottom: 2px solid var(--card-border); margin-bottom: 24px;
}
.ptab {
  padding: 10px 20px; font-size: .85rem; font-weight: 500; color: var(--text-500);
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s;
  cursor: pointer;
}
.ptab:hover { color: var(--text-900); }
.ptab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* ================================================================
   KNOWLEDGE HEALTH PANEL
   ================================================================ */
.kh-panel {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--card-shadow);
}
.kh-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.kh-header h3 { font-size: 1rem; }
.kh-score-badge {
  font-family: 'Newsreader', serif; font-weight: 700; font-size: 1.1rem;
  padding: 2px 10px; border-radius: 8px;
}
.kh-score-ring {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.kh-subs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.kh-sub { display: flex; align-items: center; gap: 10px; }
.kh-sub-label { font-size: .78rem; color: var(--text-500); width: 80px; flex-shrink: 0; }
.kh-sub-bar { flex: 1; height: 6px; background: #d4dae6; border-radius: 3px; overflow: hidden; }
.kh-sub-fill { height: 100%; border-radius: 3px; transition: width .8s ease; }
.kh-sub-val { font-size: .75rem; font-weight: 600; color: var(--text-700); width: 36px; text-align: right; }

.kh-gaps { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.kh-gap-item {
  font-size: .78rem; display: flex; align-items: center; gap: 7px;
  padding: 6px 10px; border-radius: var(--radius-sm);
}
.kh-gap-item.warn { color: var(--amber-700); background: var(--amber-50); }
.kh-gap-item.ok { color: var(--green-700); background: var(--green-50); }
.kh-gap-item.miss { color: var(--red-700); background: var(--red-50); }

.kh-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.kh-action-btn {
  padding: 7px 14px; border-radius: var(--radius-sm); font-size: .78rem; font-weight: 500;
  background: var(--blue-50); color: var(--blue-700); border: 1px solid var(--blue-100);
  transition: all .2s;
}
.kh-action-btn:hover { background: var(--blue-100); }

/* ================================================================
   OVERVIEW 3-COL LAYOUT
   ================================================================ */
.overview-grid {
  display: grid; grid-template-columns: 280px 1fr 320px; gap: 20px;
}
@media (max-width: 1100px) { .overview-grid { grid-template-columns: 1fr; } }

.current-state-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--card-shadow);
}
.state-narrative {
  font-size: .9rem; line-height: 1.65; color: var(--text-700); margin-bottom: 18px;
  font-style: italic; font-family: 'Newsreader', serif;
}
.state-narrative strong { color: var(--text-900); font-style: normal; }

.signals-list { display: flex; flex-direction: column; gap: 6px; }
.signal-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: var(--radius-sm); font-size: .82rem; transition: background .15s;
  cursor: pointer;
}
.signal-item:hover { background: var(--slate-100); }
.signal-date { font-size: .72rem; color: var(--text-300); width: 40px; flex-shrink: 0; font-weight: 500; }
.signal-icon { font-size: .85rem; flex-shrink: 0; }
.signal-type {
  font-size: .65rem; font-weight: 600; padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0;
}
.signal-text { color: var(--text-700); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-timeline-link {
  display: flex; align-items: center; gap: 5px; margin-top: 12px;
  font-size: .82rem; font-weight: 600; color: var(--accent); cursor: pointer;
}
.view-timeline-link:hover { text-decoration: underline; }

/* ASK PANEL (right column) */
.ask-panel {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--card-shadow);
  display: flex; flex-direction: column;
}
.ask-panel h3 { margin-bottom: 12px; font-size: 1rem; }
.ask-input-wrap {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.ask-input {
  flex: 1; padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--card-border); background: var(--page-bg);
  font-size: .85rem; outline: none; transition: border-color .2s;
}
.ask-input:focus { border-color: var(--accent); }
.ask-btn {
  padding: 10px 18px; border-radius: 8px; font-size: .82rem; font-weight: 600;
  background: var(--accent); color: #fff; transition: background .2s;
}
.ask-btn:hover { background: var(--accent-hover); }
.ask-suggestions { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.ask-suggestion {
  font-size: .78rem; color: var(--accent); padding: 6px 10px;
  border-radius: var(--radius-sm); background: var(--blue-50); cursor: pointer;
  transition: background .15s; border: 1px solid transparent;
}
.ask-suggestion:hover { background: var(--blue-100); border-color: var(--blue-100); }

/* ASK ANSWER */
.ask-answer { display: none; flex-direction: column; gap: 14px; animation: fadeIn .4s ease; }
.ask-answer.visible { display: flex; }
.ask-answer-text { font-size: .85rem; line-height: 1.65; color: var(--text-700); }
.ask-answer-text strong { color: var(--text-900); }
.ask-answer-text li { margin-left: 16px; margin-bottom: 4px; }

.evidence-section { margin-top: 4px; }
.evidence-section h4 { font-size: .82rem; margin-bottom: 8px; }
.evidence-source {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px;
  background: var(--slate-100); border-radius: var(--radius-sm); margin-bottom: 6px;
  font-size: .78rem; cursor: pointer; transition: background .15s;
}
.evidence-source:hover { background: var(--blue-50); }
.evidence-source .ev-icon { flex-shrink: 0; }
.evidence-source .ev-detail { flex: 1; }
.evidence-source .ev-detail .ev-title { font-weight: 600; color: var(--text-900); }
.evidence-source .ev-detail .ev-meta { color: var(--text-500); font-size: .72rem; margin-top: 2px; }
.evidence-strength {
  display: flex; align-items: center; gap: 6px; font-size: .75rem; padding: 6px 10px;
  border-radius: var(--radius-sm); margin-top: 6px;
}
.evidence-strength.high { background: var(--green-50); color: var(--green-700); }
.evidence-strength.medium { background: var(--amber-50); color: var(--amber-700); }
.evidence-gap-warn {
  font-size: .75rem; color: var(--amber-700); padding: 8px 10px;
  background: var(--amber-50); border-radius: var(--radius-sm); margin-top: 6px;
  line-height: 1.5;
}

/* ================================================================
   TIMELINE
   ================================================================ */
.timeline-strip {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); margin-bottom: 16px; font-size: .78rem;
  flex-wrap: wrap;
}
.timeline-strip .ts-item { display: flex; align-items: center; gap: 5px; color: var(--text-500); }
.timeline-strip .ts-item.ok { color: var(--green-700); }
.timeline-strip .ts-item.warn { color: var(--amber-700); }
.timeline-strip .ts-item.miss { color: var(--red-700); }

.timeline-filters {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.tf-btn {
  padding: 6px 14px; border-radius: 20px; font-size: .78rem; font-weight: 500;
  background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-500);
  transition: all .2s;
}
.tf-btn:hover { border-color: var(--accent); color: var(--accent); }
.tf-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.timeline-group { margin-bottom: 24px; position: relative; padding-left: 28px; }
.timeline-date {
  font-family: 'Newsreader', serif; font-weight: 600; font-size: .9rem;
  color: var(--text-900); margin-bottom: 10px; margin-left: -28px;
}
.timeline-connector {
  position: absolute; left: 7px; top: 30px; bottom: 10px; width: 2px;
  background: var(--card-border); border-radius: 1px;
}

.tl-entry {
  position: relative; margin-bottom: 8px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.02);
  transition: box-shadow .2s;
}
.tl-entry:hover { box-shadow: var(--card-shadow); }
.tl-entry::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.tl-entry[data-type="decision"]::before { background: var(--purple-600); }
.tl-entry[data-type="email"]::before { background: var(--blue-600); }
.tl-entry[data-type="weekly"]::before { background: var(--green-600); }
.tl-entry[data-type="risk"]::before { background: var(--amber-600); }
.tl-entry[data-type="ado"]::before { background: var(--slate-600); }
.tl-entry[data-type="transcript"]::before { background: var(--purple-600); }
.tl-entry[data-type="document"]::before { background: var(--cyan-600); }
.tl-entry[data-type="blocker"]::before { background: var(--red-600); }

.tl-entry-dot {
  position: absolute; left: -24px; top: 14px;
  width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 2px var(--card-border);
}

.tl-entry-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 16px;
  cursor: pointer; user-select: none;
}
.tl-entry-icon { font-size: .9rem; flex-shrink: 0; }
.tl-entry-type {
  font-size: .62rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: .07em; flex-shrink: 0;
}
.tl-entry-time { font-size: .72rem; color: var(--text-300); flex-shrink: 0; min-width: 52px; }
.tl-entry-title { font-size: .85rem; color: var(--text-700); flex: 1; font-weight: 500; }
.tl-entry-expand {
  font-size: .75rem; color: var(--text-300); transition: transform .2s; flex-shrink: 0;
}
.tl-entry.open .tl-entry-expand { transform: rotate(90deg); }

.tl-entry-detail {
  display: none; padding: 0 16px 14px 16px; font-size: .82rem;
  color: var(--text-700); line-height: 1.6; border-top: 1px solid var(--card-border);
  animation: fadeIn .25s ease;
}
.tl-entry.open .tl-entry-detail { display: block; }
.tl-entry-detail p { margin-top: 10px; }
.tl-entry-detail .detail-list { list-style: none; margin-top: 8px; }
.tl-entry-detail .detail-list li { padding: 3px 0; padding-left: 16px; position: relative; }
.tl-entry-detail .detail-list li::before { content: '\2022'; position: absolute; left: 0; color: var(--text-300); }
.tl-source-link {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 10px;
  font-size: .78rem; font-weight: 600; color: var(--accent);
}

/* ================================================================
   DATA VIEW
   ================================================================ */
.data-subtabs { display: flex; gap: 8px; margin-bottom: 18px; }
.dst-btn {
  padding: 7px 16px; border-radius: 8px; font-size: .82rem; font-weight: 500;
  background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-500);
  transition: all .2s;
}
.dst-btn:hover { border-color: var(--accent); color: var(--accent); }
.dst-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.data-table-wrap {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--card-shadow);
}
.data-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.data-table th {
  text-align: left; padding: 12px 16px; font-size: .72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em; color: var(--text-500);
  background: var(--page-bg); border-bottom: 1px solid var(--card-border);
}
.data-table td {
  padding: 12px 16px; border-bottom: 1px solid var(--card-border); color: var(--text-700);
  vertical-align: top;
}
.data-table tr { cursor: pointer; transition: background .15s; }
.data-table tbody tr:hover { background: var(--blue-50); }
.data-table tbody tr:last-child td { border-bottom: none; }

.severity-badge {
  font-size: .68rem; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  text-transform: uppercase;
}
.severity-badge.high { background: var(--red-100); color: var(--red-700); }
.severity-badge.med { background: var(--amber-100); color: var(--amber-700); }
.severity-badge.low { background: var(--green-100); color: var(--green-700); }

.status-badge-sm {
  font-size: .68rem; font-weight: 500; padding: 2px 8px; border-radius: 4px;
}
.status-badge-sm.open { background: var(--amber-50); color: var(--amber-700); }
.status-badge-sm.active { background: var(--red-50); color: var(--red-700); }
.status-badge-sm.watch { background: var(--slate-100); color: var(--slate-600); }
.status-badge-sm.done { background: var(--green-50); color: var(--green-700); }
.status-badge-sm.planned { background: var(--blue-50); color: var(--blue-700); }
.status-badge-sm.progress { background: var(--purple-50); color: var(--purple-700); }
.status-badge-sm.at-risk { background: var(--red-50); color: var(--red-700); }

.data-detail-panel {
  display: none; padding: 16px 20px; background: var(--slate-100);
  border-top: 1px solid var(--card-border);
  animation: fadeIn .25s ease;
}
.data-detail-panel.visible { display: block; }
.ddp-title { font-family: 'Newsreader', serif; font-weight: 600; font-size: 1rem; margin-bottom: 10px; }
.ddp-field { font-size: .82rem; margin-bottom: 6px; color: var(--text-500); }
.ddp-field strong { color: var(--text-700); }
.ddp-events { margin-top: 12px; }
.ddp-events h4 { font-size: .82rem; margin-bottom: 8px; color: var(--text-500); }
.ddp-event { font-size: .8rem; padding: 4px 0; color: var(--text-700); }
.ddp-event::before { content: '\2022'; margin-right: 8px; color: var(--text-300); }

/* Progress bar for PI objectives */
.progress-bar { width: 80px; height: 6px; background: #d4dae6; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.progress-fill { height: 100%; border-radius: 3px; }

/* ================================================================
   SOURCES VIEW
   ================================================================ */
.source-filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.source-list { display: flex; flex-direction: column; gap: 8px; }
.source-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); box-shadow: var(--card-shadow);
  cursor: pointer; transition: box-shadow .2s, transform .2s;
}
.source-item:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-1px); }
.source-icon { font-size: 1.3rem; flex-shrink: 0; }
.source-info { flex: 1; }
.source-title { font-weight: 600; font-size: .88rem; color: var(--text-900); }
.source-meta { font-size: .78rem; color: var(--text-500); margin-top: 2px; }
.source-badge {
  font-size: .65rem; font-weight: 600; padding: 3px 10px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: .06em;
}

/* ================================================================
   REPORTS VIEW
   ================================================================ */
.report-config {
  display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  padding: 16px 20px; background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); flex-wrap: wrap;
}
.report-config label { font-size: .82rem; color: var(--text-500); font-weight: 500; }
.report-config select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
  background: var(--page-bg); font-family: inherit; font-size: .85rem; color: var(--text-900);
}
.generate-btn {
  padding: 10px 24px; border-radius: 8px; font-size: .85rem; font-weight: 600;
  background: var(--accent); color: #fff; margin-left: auto; transition: all .2s;
  display: flex; align-items: center; gap: 8px;
}
.generate-btn:hover { background: var(--accent-hover); }

.report-coverage {
  padding: 16px 20px; margin-bottom: 20px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); box-shadow: var(--card-shadow);
}
.report-coverage h3 { font-size: 1rem; margin-bottom: 12px; }
.rc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 8px; margin-bottom: 12px; }
.rc-item { display: flex; align-items: center; gap: 6px; font-size: .8rem; }
.rc-item.ok { color: var(--green-700); }
.rc-item.miss { color: var(--amber-700); }
.rc-item.stale { color: var(--red-700); }
.rc-warn {
  font-size: .8rem; padding: 10px 14px; background: var(--amber-50);
  border-radius: var(--radius-sm); color: var(--amber-700); line-height: 1.5;
}

.report-output {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-lg); box-shadow: var(--card-shadow); overflow: hidden;
}
.report-header-bar {
  padding: 16px 20px; background: var(--page-bg);
  border-bottom: 1px solid var(--card-border);
}
.report-header-bar h2 { font-size: 1.2rem; margin-bottom: 4px; }
.report-header-bar .rh-meta { font-size: .78rem; color: var(--text-500); }

.report-section {
  padding: 18px 20px; border-bottom: 1px solid var(--card-border);
}
.report-section:last-child { border-bottom: none; }
.report-section-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.report-section-header h3 { font-size: .95rem; }
.report-edit-btn {
  font-size: .75rem; color: var(--text-300); padding: 4px 10px;
  border-radius: var(--radius-sm); transition: all .15s;
}
.report-edit-btn:hover { background: var(--slate-100); color: var(--text-700); }
.report-section p { font-size: .88rem; line-height: 1.7; color: var(--text-700); }
.report-section ul { list-style: none; margin-top: 6px; }
.report-section ul li { font-size: .86rem; color: var(--text-700); padding: 3px 0 3px 18px; position: relative; }
.report-section ul li::before { content: '\2022'; position: absolute; left: 0; color: var(--accent); }

.report-export-bar {
  display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--card-border);
  background: var(--page-bg);
}
.export-btn {
  padding: 9px 18px; border-radius: 8px; font-size: .82rem; font-weight: 500;
  background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-700);
  transition: all .2s; display: flex; align-items: center; gap: 6px;
}
.export-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Report loading */
.report-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; color: var(--text-500); gap: 16px;
}
.report-spinner {
  width: 36px; height: 36px; border: 3px solid var(--card-border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
}

/* ================================================================
   ANIMATIONS
   ================================================================ */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes ringDraw {
  from { stroke-dashoffset: 251; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Stagger cards */
.pcard:nth-child(1) { animation-delay: 0s; }
.pcard:nth-child(2) { animation-delay: .08s; }
.pcard:nth-child(3) { animation-delay: .16s; }
.pcard:nth-child(4) { animation-delay: .24s; }
.pcard:nth-child(5) { animation-delay: .32s; }
.pcard:nth-child(6) { animation-delay: .4s; }

/* Report sections stagger */
.report-section { animation: slideUp .4s ease both; }
.report-section:nth-child(1) { animation-delay: .1s; }
.report-section:nth-child(2) { animation-delay: .2s; }
.report-section:nth-child(3) { animation-delay: .3s; }
.report-section:nth-child(4) { animation-delay: .4s; }
.report-section:nth-child(5) { animation-delay: .5s; }

/* ================================================================
   SCROLLBAR
   ================================================================ */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-100); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-300); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

</style>
